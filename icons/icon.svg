<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75"><stop offset="0" stop-color="#1a1030"/><stop offset="1" stop-color="#060509"/></radialGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8b4fe"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <pattern id="scan" width="512" height="8" patternUnits="userSpaceOnUse"><rect width="512" height="2" fill="#a78bfa" opacity=".07"/></pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#scan)"/>
  <!-- triangle avec léger décalage « glitch » -->
  <path d="M256 92 L420 380 H92 Z" fill="none" stroke="#22d3ee" stroke-opacity=".35" stroke-width="14" stroke-linejoin="round" transform="translate(-6 3)"/>
  <path d="M256 92 L420 380 H92 Z" fill="none" stroke="url(#tri)" stroke-width="16" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- œil -->
  <path d="M168 276 Q256 196 344 276 Q256 356 168 276 Z" fill="#0b0712" stroke="#e9d5ff" stroke-width="9" stroke-linejoin="round"/>
  <circle cx="256" cy="276" r="34" fill="none" stroke="#a78bfa" stroke-width="9"/>
  <circle cx="256" cy="276" r="13" fill="#ffffff"/>
  <!-- réticule de scan -->
  <path d="M256 226 v-14 M256 326 v14 M206 276 h-14 M306 276 h14" stroke="#a78bfa" stroke-width="7" stroke-linecap="round"/>
  <!-- invite de terminal -->
  <text x="256" y="452" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="54" fill="#a78bfa" letter-spacing="4">&gt;_</text>
</svg>
